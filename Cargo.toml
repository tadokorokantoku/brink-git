[package]
name = "brinkgit"
version = "0.1.0"
edition = "2021"
description = "Branch-scoped links for issues and documents (stored under .git/brink)"
license = "MIT"
readme = "README.md"

[[bin]]
name = "brink"
path = "src/main.rs"

[lib]
name = "brinkgit"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.14"
